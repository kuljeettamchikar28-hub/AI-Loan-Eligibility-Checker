[build]
  publish = "public"

[dev]
  command = "node server.js"
  port = 3000

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/save-record"
  to = "/.netlify/functions/save-record"
  status = 200

[[redirects]]
  from = "/api/get-records"
  to = "/.netlify/functions/get-records"
  status = 200

[[redirects]]
  from = "/api/delete-record"
  to = "/.netlify/functions/get-records"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "private,no-store"
